# Tool configuration only; this repository is not packaged for distribution.

[tool.ruff]
target-version = "py39"
line-length = 120
src = ["chapter01/src/main/python", "chapter02/src/main/python", "chapter03/src/main/python"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
# Recipes are written notebook-style: imports appear next to the step that uses them.
ignore = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
